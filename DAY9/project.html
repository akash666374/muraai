<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodie</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="stylesheet" href="project.css">

</head>

<body>

    <h1>Foodie</h1>

    <div id="search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input id="searchInput" type="text" placeholder="Search food...">

        <i class="fa-solid fa-cart-shopping"></i>

    </div>

    <div>

        <h4>CATEGORIES</h4>

    </div>

    <div id="items">

        <button class="category">ALL</button>

        <button class="category">PIZZA</button>

        <button class="category">BURGER</button>

        <button class="category">CHICKEN</button>

    </div>

    <div>

        <h2>POPULAR FOOD</h2>

    </div>


    <div id="foodContainer">

    </div>

    <div>

        <h2>YOUR CART</h2>

        <div id="cartContainer">

        </div>

        <h3 id="total">
            Total: ₹0
        </h3>
        <button id="orderButton">
            Place Order
        </button>

        <p id="orderStatus">
            Status: Not Ordered
        </p>

        <p id="orderDate"></p>
    </div>

    <script src="project.js"></script>

</body>

</html>
